# Checks on what a pull request adds to history, as opposed to what its code
# does (that is ci.yml). They run on every PR, docs-only ones included,
# because a commit message or a leaked secret matters whatever the files are.
#   - commit-messages: Conventional Commits and no AI or co-author
#     attribution (.github/scripts/check-commit-messages.sh). Skipped on the
#     dev to main promotion, whose commits were already checked on their way
#     into dev.
#   - secret-scan: gitleaks over the PR's commits only (base..HEAD), not the
#     whole history (.github/.gitleaks.toml).
#
# Kept identical in obiudo-core, obiudo-processor and obiudo-proto.
#
# Hardening: read-only token, actions pinned to full commit SHAs, no
# pull_request_target, no secrets used, credentials not kept after checkout,
# gitleaks pinned to an exact release and checked against its SHA-256, and
# branch names reach the shell through env variables, never through ${{ }}
# inside a script.
name: pr-checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    name: commit-messages
    if: github.base_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 fetches every branch with full history, so the base
      # branch is present as origin/<base> without a second, credentialed
      # fetch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the base branch was fetched
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git rev-parse --verify "refs/remotes/origin/${BASE_REF}"
      - name: Check commit messages
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/check-commit-messages.sh "origin/${BASE_REF}"

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks binary, not gitleaks-action. The version is pinned and the
      # download must match the SHA-256 published with that release, so a
      # replaced asset cannot run here.
      - name: Install gitleaks (pinned release, checksum verified)
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "${RUNNER_TEMP}/gitleaks" version
      # Only the commits this PR adds; any finding fails the job. --redact
      # keeps the secret itself out of the log.
      - name: Scan the PR's commits
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          "${RUNNER_TEMP}/gitleaks" git \
            --log-opts="origin/${BASE_REF}..HEAD" \
            -c .github/.gitleaks.toml \
            --redact \
            --exit-code 1 \
            --no-banner
